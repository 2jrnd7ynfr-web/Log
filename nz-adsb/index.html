<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZ Skies Live</title>
<meta name="description" content="Live ADS-B aircraft over New Zealand, Australia and the south-west Pacific, from the adsb.fi open data feed.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --surface-2: #F5F7F9;
    --ink: #18212B;
    --muted: #5C6B7A;
    --line: #DAE0E6;
    --accent: #0F6FB8;
    --accent-soft: #E1EEF8;
    --alert: #C62F2F;
    --alert-soft: #FBE4E4;
    --plane-stroke: #18212B;
    --shadow: 0 2px 10px rgba(24, 33, 43, 0.12);
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1217;
      --surface: #151C23;
      --surface-2: #1B242D;
      --ink: #E4EAF0;
      --muted: #8A9AAA;
      --line: #27323D;
      --accent: #5AAEEA;
      --accent-soft: #19303F;
      --alert: #FF6B6B;
      --alert-soft: #3A1D1F;
      --plane-stroke: #0D1217;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1217;
    --surface: #151C23;
    --surface-2: #1B242D;
    --ink: #E4EAF0;
    --muted: #8A9AAA;
    --line: #27323D;
    --accent: #5AAEEA;
    --accent-soft: #19303F;
    --alert: #FF6B6B;
    --alert-soft: #3A1D1F;
    --plane-stroke: #0D1217;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100dvh;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    z-index: 1000;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }
  .stats {
    display: flex;
    gap: 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
    align-items: center;
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }
  .stats b { color: var(--ink); font-weight: 600; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-right: 6px; vertical-align: 0;
  }
  .dot.ok { background: #2FA866; }
  .dot.err { background: var(--alert); }
  .icon-btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 8px;
    height: 32px; min-width: 32px;
    padding: 0 10px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    min-height: 0;
  }
  #map { min-height: 0; background: var(--bg); }

  aside {
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  .panel-head input {
    flex: 1;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    padding: 0 10px;
    font: inherit;
    min-width: 0;
  }
  .panel-head input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .panel-head select {
    height: 34px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; padding: 0 6px;
  }

  #list { overflow-y: auto; flex: 1; }
  .row {
    display: grid;
    grid-template-columns: 6px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 9px 16px 9px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:hover { background: var(--surface-2); }
  .row.sel { background: var(--accent-soft); }
  .row .swatch { width: 6px; height: 30px; border-radius: 3px; }
  .row .cs { font-family: var(--mono); font-weight: 600; font-size: 13px; }
  .row .sub { color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .num { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); line-height: 1.4; }
  .row .num b { color: var(--ink); font-weight: 500; }
  .row.emerg .cs { color: var(--alert); }
  .empty { padding: 24px 16px; color: var(--muted); line-height: 1.5; }

  #detail { border-bottom: 1px solid var(--line); display: none; }
  #detail.open { display: block; }
  .d-top {
    padding: 14px 16px 10px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .d-top h2 { margin: 0; font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .d-top .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .d-top .icon-btn { margin-left: auto; }
  .badge {
    display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px; background: var(--alert-soft); color: var(--alert);
    margin-left: 6px; vertical-align: 3px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
  }
  .cell { background: var(--surface); padding: 8px 12px; }
  .cell .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .cell .v { font-family: var(--mono); font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-links { padding: 10px 16px; display: flex; gap: 14px; font-size: 13px; }
  .d-links a { color: var(--accent); text-decoration: none; }
  .d-links a:hover { text-decoration: underline; }

  .legend {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    box-shadow: var(--shadow);
    font-family: var(--mono);
    font-size: 11px;
  }
  .legend .bar { height: 8px; width: 220px; border-radius: 4px; margin: 4px 0 3px; }
  .legend .ticks { display: flex; justify-content: space-between; color: var(--muted); }

  .banner {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    z-index: 900; max-width: calc(100% - 32px);
    background: var(--alert-soft); color: var(--alert);
    border: 1px solid var(--alert); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; display: none;
  }
  .banner.show { display: block; }
  .map-wrap { position: relative; min-height: 0; display: grid; }

  /* Hover card (desktop): compact, plain panel in the page's own colours */
  .hover-card {
    position: absolute; left: 0; top: 0; z-index: 950; pointer-events: none;
    width: 188px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    font-family: var(--sans); overflow: hidden;
  }
  .hover-card[hidden] { display: none; }
  .hover-card .hc-route, .hover-card .hc-route-none, .hover-card .hc-stats { border-top: 1px solid var(--line); }
  .hc-top { padding: 8px 10px 7px; }
  .hc-flight { font-size: 18px; font-weight: 700; line-height: 1.1; }
  .hc-airline { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .hc-type { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hc-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; padding: 6px 10px; }
  .hc-route > div { min-width: 0; }
  .hc-route > div:last-child { text-align: right; }
  .hc-route b { display: block; font-size: 16px; font-weight: 700; line-height: 1.1; }
  .hc-route span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hc-arrow { font-size: 14px; color: var(--muted); }
  .hc-route-none { padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .hc-stats { display: grid; grid-template-columns: 1fr 1fr; }
  .hc-stats > div { padding: 5px 10px 7px; min-width: 0; }
  .hc-stats > div + div { border-left: 1px solid var(--line); }
  .hc-stats span { display: block; font-size: 9.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .hc-stats b { display: block; font-size: 13px; font-weight: 600; margin-top: 1px; white-space: nowrap; }
  .hc-stats small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .hc-trend { font-style: normal; font-size: 9px; color: var(--muted); vertical-align: 1px; }

  /* Wind layer control */
  .wind-ctl {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 8px 10px;
    font-size: 12px;
    width: 236px;
  }
  .wind-ctl .wind-row { display: flex; align-items: center; gap: 8px; }
  .wind-ctl .wind-row span { font-weight: 600; }
  .wind-ctl select {
    flex: 1; min-width: 0; height: 28px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 12px; padding: 0 4px;
  }
  .wind-ctl .wind-more { display: none; margin-top: 8px; }
  .wind-ctl.on .wind-more { display: block; }
  .wind-ctl .bar { height: 8px; border-radius: 4px; margin: 2px 0 3px; }
  .wind-ctl .ticks { display: flex; justify-content: space-between; color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .wind-ctl .wind-meta { color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .wind-ctl .wind-here { font-family: var(--mono); margin-top: 4px; min-height: 1.4em; }
  .wind-ctl .wind-err { color: var(--alert); }
  .wind-ctl .lyr-head {
    display: flex; justify-content: space-between; width: 100%;
    background: none; border: none; color: var(--ink); padding: 0 0 6px;
    font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer;
  }
  .wind-ctl.collapsed .lyr-head { padding-bottom: 0; }
  .wind-ctl.collapsed .lyr-head span { display: inline-block; transform: rotate(-90deg); }
  .wind-ctl.collapsed .lyr-body { display: none; }
  .wind-ctl .lyr-sec { border-top: 1px solid var(--line); padding: 7px 0; }
  .wind-ctl .lyr-sec:last-child { padding-bottom: 0; }
  .wind-ctl .lyr-row { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; min-height: 24px; }
  .wind-ctl .lyr-row input { margin: 0; width: 15px; height: 15px; accent-color: var(--accent); }
  .wind-ctl .lyr-more { display: none; margin-top: 6px; }
  .wind-ctl .lyr-sec.on .lyr-more { display: block; }
  .fc-chips { display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; }
  .fc-chips i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .radar-bar { display: flex; align-items: center; gap: 8px; }
  .radar-bar .icon-btn { height: 26px; min-width: 30px; padding: 0 6px; font-size: 11px; }
  .radar-bar input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .radar-scale { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .radar-ramp { flex: 1; height: 7px; border-radius: 4px;
    background: linear-gradient(90deg, #88ddee, #0099cc, #0077aa, #ffee00, #ffaa00, #ff4400, #c10000, #ffaaff); }

  /* Airport markers and popups */
  .ap-icon { background: none; border: none; }
  .ap-pill {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 1px 6px 1px 3px; box-shadow: var(--shadow);
    font-family: var(--mono); font-size: 11px; font-weight: 600; cursor: pointer;
    transform: translate(-8px, -50%); /* dot sits on the airport */
  }
  .ap-pill i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
  .ap-pill small { font-weight: 400; color: var(--muted); }
  .ap-pill.dot-only { padding: 2px; border-radius: 50%; transform: translate(-50%, -50%); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.4; width: 280px !important; max-width: calc(100vw - 80px); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .ap-pop h3 { margin: 0; font-size: 15px; }
  .ap-pop .fc { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600; color: #fff; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .ap-pop .sub { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .ap-pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 8px; }
  .ap-pop dt { color: var(--muted); font-size: 12px; }
  .ap-pop dd { margin: 0; font-family: var(--mono); font-size: 12px; }
  .ap-pop pre {
    margin: 4px 0 8px; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
    font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word;
  }
  .ap-pop .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .leaflet-wind-pane { pointer-events: none; }
  .leaflet-wind-pane canvas { position: absolute; left: 0; top: 0; pointer-events: none; }

  /* Aircraft markers */
  .ac-icon { background: none; border: none; }
  .ac-icon svg { display: block; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .ac-icon.sel svg { filter: drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 2px var(--accent)); }
  .ac-label {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; box-shadow: none;
    font-family: var(--mono); font-size: 11px; padding: 1px 4px;
  }
  .ac-label::before { display: none; }
  .leaflet-container { font-family: var(--sans); }
  /* Fallback OpenStreetMap tiles: mute the colours so aircraft stand out, and invert
     them for dark mode (OSM has no dark style). MapTiler's own styles need neither. */
  .basemap-osm .leaflet-tile-pane { filter: saturate(0.45) contrast(0.92) brightness(1.04); }
  :root[data-theme="dark"] .basemap-osm .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) saturate(0.35) brightness(0.85) contrast(0.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .basemap-osm .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) saturate(0.35) brightness(0.85) contrast(0.9);
    }
  }
  .leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 85%, transparent) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--accent); }

  .jump-ctl {
    display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .jump-ctl button {
    border: none; background: none; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; cursor: pointer; border-right: 1px solid var(--line);
  }
  .jump-ctl button:last-child { border-right: none; }
  .jump-ctl button:hover { background: var(--surface-2); }
  .jump-ctl button.on { background: var(--accent-soft); color: var(--accent); }

  .sheet-toggle { display: none; }

  @media (max-width: 760px) {
    header { gap: 10px; }
    header h1 { font-size: 15px; }
    .stats .hide-sm { display: none; }
    .stats { gap: 10px; }
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside {
      border-left: none; border-top: 1px solid var(--line);
      max-height: 46dvh;
    }
    aside.collapsed #list, aside.collapsed .panel-head { display: none; }
    .sheet-toggle {
      display: block; width: 100%; border: none; background: var(--surface);
      color: var(--muted); font: inherit; font-size: 12px; padding: 6px; cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .legend .bar { width: 150px; }
    .wind-ctl { width: 184px; padding: 6px 8px; }
    .fc-chips { gap: 6px; font-size: 10px; }
    /* Map is about half the screen on phones; keep the panel inside it */
    .wind-ctl .lyr-body { max-height: calc(54dvh - 170px); overflow-y: auto; }
    body:has(aside.collapsed) .wind-ctl .lyr-body { max-height: calc(100dvh - 260px); }
    .wind-ctl .wind-meta { margin-top: 3px; font-size: 11px; }
    .wind-ctl .wind-here { font-size: 11px; }
    .leaflet-control-attribution { max-width: calc(100vw - 196px); font-size: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>NZ Skies <span>Live</span></h1>
  <div class="stats">
    <span><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span><span class="hide-sm" id="cycleText"></span></span>
    <span><b id="count">0</b> aircraft</span>
    <span class="hide-sm">updated <b id="updated">—</b></span>
  </div>
  <button class="icon-btn" id="labelsBtn" title="Toggle callsign labels" aria-pressed="false">Labels</button>
  <button class="icon-btn" id="themeBtn" title="Toggle light/dark">◐</button>
</header>

<main>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="banner" id="banner"></div>
    <div class="hover-card" id="hoverCard" hidden role="tooltip"></div>
  </div>
  <aside id="aside">
    <button class="sheet-toggle" id="sheetToggle">Hide list ▾</button>
    <div id="detail"></div>
    <div class="panel-head">
      <input id="search" type="search" placeholder="Search callsign, rego, type, squawk" autocomplete="off">
      <select id="sort" aria-label="Sort by">
        <option value="cs">Callsign</option>
        <option value="alt">Altitude</option>
        <option value="gs">Speed</option>
        <option value="type">Type</option>
      </select>
    </div>
    <div id="list"><div class="empty">Waiting for the first update from adsb.fi…</div></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  // ---------- Config ----------
  // server.js polls adsb.fi for the NZ regions and serves a merged snapshot here
  // (adsb.fi has no CORS headers, so the browser can't call it directly).
  const FEED_URL = "api/aircraft";
  const POLL_MS = 2000;
  const STALE_S = 90;          // drop aircraft not heard from in this long
  // NZ is the home view; the map also covers Australia and the Pacific out to Fiji.
  // Longitudes east of 180° (eastern Fiji) continue past 180 so the region is continuous.
  const NZ_BOUNDS = L.latLngBounds([-48.5, 164.5], [-33.0, 179.9]);
  const VIEWS = {
    NZ: NZ_BOUNDS,
    Australia: L.latLngBounds([-44, 112], [-10, 154]),
    Pacific: L.latLngBounds([-30, 158], [-12, 182]),
  };
  const REGION_BOUNDS = L.latLngBounds([-50, 108], [-7, 184]);
  const MAX_BOUNDS = REGION_BOUNDS.pad(0.08);
  const TRAIL_MAX = 400;

  // ---------- State ----------
  const aircraft = new Map(); // hex -> record
  let selected = null;
  let showLabels = false;
  let lastOk = 0;
  let failStreak = 0;

  // ---------- Theme ----------
  const root = document.documentElement;
  const isDark = () =>
    root.dataset.theme ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
  try { const t = localStorage.getItem("nzskies-theme"); if (t) root.dataset.theme = t; } catch {}
  try { showLabels = localStorage.getItem("nzskies-labels") === "1"; } catch {}

  // ---------- Map ----------
  const map = L.map("map", {
    zoomControl: true,
    minZoom: 3,
    maxBounds: MAX_BOUNDS,
    maxBoundsViscosity: 0.8,
    worldCopyJump: false,
    preferCanvas: false,
  }).fitBounds(NZ_BOUNDS);

  // Basemap: MapTiler's muted "Dataviz" styles (light and dark) when the server has a
  // MapTiler key (MAPTILER_KEY on Render); otherwise OpenStreetMap's standard tiles,
  // which need no key but are only meant for light use and have no dark style.
  const DATA_ATTRIB = 'Data <a href="https://adsb.fi">adsb.fi</a>';
  const OSM_ATTRIB = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · ' + DATA_ATTRIB;
  const MT_ATTRIB = '<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">&copy; MapTiler</a> ' +
    '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a> · ' + DATA_ATTRIB;
  const MT_STYLES = { light: "dataviz", dark: "dataviz-dark" };
  let maptilerKey = null;
  const basemapUrl = () => maptilerKey
    ? `https://api.maptiler.com/maps/${isDark() ? MT_STYLES.dark : MT_STYLES.light}/256/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(maptilerKey)}`
    : "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
  const tiles = L.tileLayer(basemapUrl(), { maxZoom: 19, attribution: OSM_ATTRIB }).addTo(map);
  map.getContainer().classList.add("basemap-osm");
  function useBasemap(key) {
    maptilerKey = key;
    map.getContainer().classList.toggle("basemap-osm", !key);
    map.attributionControl.removeAttribution(key ? OSM_ATTRIB : MT_ATTRIB);
    map.attributionControl.addAttribution(key ? MT_ATTRIB : OSM_ATTRIB);
    tiles.setUrl(basemapUrl());
  }
  // Switch to MapTiler only after one test tile loads. A bad, expired or over-quota key
  // (or one restricted to other websites) still returns an image, so a plain tile layer
  // can't tell; checking the status first keeps the map on OpenStreetMap instead.
  fetch("api/config", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : {}))
    .then(async (cfg) => {
      if (!cfg.maptilerKey) return;
      const test = await fetch(`https://api.maptiler.com/maps/${MT_STYLES.light}/256/5/31/19.png?key=${encodeURIComponent(cfg.maptilerKey)}`);
      if (test.ok) useBasemap(cfg.maptilerKey);
      else console.warn(`MapTiler key rejected (HTTP ${test.status}); using OpenStreetMap tiles`);
    })
    .catch((e) => console.warn("MapTiler unavailable; using OpenStreetMap tiles", e));

  const trailLayer = L.layerGroup().addTo(map);
  const planeLayer = L.layerGroup().addTo(map);

  // Altitude colour scale (roughly tar1090-style hue sweep)
  const ALT_STOPS = [
    [0, 20], [500, 10], [2000, 30], [4000, 45], [6000, 60], [8000, 80], [10000, 105],
    [20000, 150], [30000, 210], [40000, 270], [45000, 300],
  ];
  function altHue(ft) {
    if (ft <= ALT_STOPS[0][0]) return ALT_STOPS[0][1];
    for (let i = 1; i < ALT_STOPS.length; i++) {
      const [a1, h1] = ALT_STOPS[i];
      if (ft <= a1) {
        const [a0, h0] = ALT_STOPS[i - 1];
        return h0 + (h1 - h0) * (ft - a0) / (a1 - a0);
      }
    }
    return ALT_STOPS[ALT_STOPS.length - 1][1];
  }
  function colorFor(ac) {
    if (ac.alt === "ground") return isDark() ? "#8A9AAA" : "#7A8794";
    if (typeof ac.alt !== "number") return isDark() ? "#C9D3DC" : "#9AA6B2";
    const l = isDark() ? 58 : 46;
    return `hsl(${altHue(ac.alt).toFixed(0)} 85% ${l}%)`;
  }

  // Legend
  // Quick jumps between NZ (home), Australia and the Pacific islands
  const jump = L.control({ position: "topleft" });
  jump.onAdd = () => {
    const d = L.DomUtil.create("div", "jump-ctl");
    d.innerHTML = Object.keys(VIEWS).map((k) => `<button data-view="${k}">${k}</button>`).join("");
    L.DomEvent.disableClickPropagation(d);
    d.addEventListener("click", (e) => {
      const k = e.target.dataset && e.target.dataset.view;
      if (k) map.flyToBounds(VIEWS[k], { duration: 0.8 });
    });
    return d;
  };
  jump.addTo(map);
  // Highlight the button for the area the map is mostly showing
  function syncJump() {
    const c = map.getCenter();
    const z = map.getZoom();
    let cur = null;
    for (const [k, b] of Object.entries(VIEWS)) if (b.pad(0.1).contains(c)) { cur = k; break; }
    if (z < 4) cur = null; // zoomed right out: no single area
    document.querySelectorAll(".jump-ctl button").forEach((b) => b.classList.toggle("on", b.dataset.view === cur));
  }
  map.on("moveend", () => { syncJump(); renderList(); render(); });
  syncJump();
  // The map is created before the page finishes laying out (fonts, the list panel),
  // so re-measure and re-centre on NZ once it has, unless the viewer has already moved it
  const homeCenter = map.getCenter();
  window.addEventListener("load", () => {
    map.invalidateSize({ animate: false });
    if (map.getCenter().equals(homeCenter)) map.fitBounds(NZ_BOUNDS, { animate: false });
  });

  const legend = L.control({ position: "bottomleft" });
  legend.onAdd = () => {
    const d = L.DomUtil.create("div", "legend");
    d.innerHTML = `Altitude (ft)<div class="bar" id="legendBar"></div>
      <div class="ticks"><span>gnd</span><span>2k</span><span>10k</span><span>20k</span><span>30k</span><span>40k+</span></div>`;
    return d;
  };
  legend.addTo(map);
  function paintLegend() {
    const bar = document.getElementById("legendBar");
    if (!bar) return;
    // Ticks are evenly spaced, so build a piecewise-even gradient across them
    const pts = [0, 2000, 10000, 20000, 30000, 40000];
    const l = isDark() ? 58 : 46;
    const stops = [];
    for (let i = 0; i < pts.length - 1; i++) {
      for (let s = 0; s < 4; s++) {
        const ft = pts[i] + (pts[i + 1] - pts[i]) * s / 4;
        stops.push(`hsl(${altHue(ft).toFixed(0)} 85% ${l}%) ${((i + s / 4) / (pts.length - 1) * 100).toFixed(1)}%`);
      }
    }
    stops.push(`hsl(${altHue(40000).toFixed(0)} 85% ${l}%) 100%`);
    bar.style.background = `linear-gradient(90deg, ${stops.join(",")})`;
  }
  paintLegend();

  // Aircraft glyphs by ADS-B emitter category
  const GLYPHS = {
    jet:  "M0,-12 L1.6,-9 L1.6,-3 L11,3 L11,5 L1.6,2.5 L1.2,8.5 L4,10.5 L4,12 L0,11 L-4,12 L-4,10.5 L-1.2,8.5 L-1.6,2.5 L-11,5 L-11,3 L-1.6,-3 L-1.6,-9 Z",
    light:"M0,-10 L1.4,-7 L1.4,-3 L10,-2 L10,0.5 L1.4,1 L1,7 L4,8 L4,9.5 L0,9 L-4,9.5 L-4,8 L-1,7 L-1.4,1 L-10,0.5 L-10,-2 L-1.4,-3 L-1.4,-7 Z",
    heli: "M0,-7 C3,-7 3.5,-3 3.5,0 C3.5,3 2,5 1,5.5 L0.8,11 L3,11.5 L3,12.5 L-3,12.5 L-3,11.5 L-0.8,11 L-1,5.5 C-2,5 -3.5,3 -3.5,0 C-3.5,-3 -3,-7 0,-7 Z M-11,-1.2 L11,-1.2 L11,0.2 L-11,0.2 Z",
    other:"M0,-7 L6,6 L0,3 L-6,6 Z",
    ground:"M-4.5,-4.5 H4.5 V4.5 H-4.5 Z",
  };
  // Not everything transmitting ADS-B is an aircraft. Emitter categories C0-C7 are
  // airport vehicles and fixed ground objects, and the aircraft database marks NZ's
  // fixed ground transmitters (Airways sites, many with no callsign) as type "TWR".
  const BEACON_CALLSIGN = /^(TWR|TXP|TEST|BCN|BEACON|SITE|XPDR)/;
  function isNonAircraft(ac) {
    if (ac.t === "TWR" || ac.r === "TWR") return true;
    if (ac.category && ac.category[0] === "C") return true;
    const still = ac.alt === "ground" || typeof ac.gs !== "number" || ac.gs < 5;
    return still && BEACON_CALLSIGN.test(ac.flight || "");
  }
  function nonAircraftKind(ac) {
    return { C1: "Emergency vehicle", C2: "Airport service vehicle", C3: "Ground obstacle" }[ac.category] ||
      (ac.t === "TWR" || BEACON_CALLSIGN.test(ac.flight || "") || ac.category === "C0" ? "Ground transmitter (beacon)" : "Ground vehicle or object");
  }
  let showGroundObjects = false;
  try { showGroundObjects = localStorage.getItem("nzskies-ground") === "1"; } catch {}
  const isShown = (ac) => showGroundObjects || !ac.nonAircraft;

  function glyphFor(cat) {
    if (!cat) return "jet";
    if (cat === "A7") return "heli";
    if (cat === "A1" || cat === "B1" || cat === "B4") return "light";
    if (cat[0] === "A") return "jet";
    return "other";
  }
  function makeIcon(ac, sel) {
    const size = ac.glyph === "jet" ? 28 : ac.glyph === "ground" ? 16 : 24;
    const rot = typeof ac.track === "number" ? ac.track : 0;
    const strokeC = getComputedStyle(root).getPropertyValue("--plane-stroke").trim() || "#000";
    const html = `<svg width="${size}" height="${size}" viewBox="-13 -13 26 26">
      <path d="${GLYPHS[ac.glyph]}" fill="${colorFor(ac)}" stroke="${strokeC}" stroke-width="0.9"
        stroke-linejoin="round" transform="rotate(${rot.toFixed(0)})"/></svg>`;
    return L.divIcon({
      className: "ac-icon" + (sel ? " sel" : ""),
      html,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
    });
  }
  const iconKey = (ac, sel) =>
    `${ac.glyph}|${Math.round(ac.track ?? 0)}|${colorFor(ac)}|${sel ? 1 : 0}`;

  // ---------- Formatting ----------
  const fmtAlt = (a) => a === "ground" ? "Ground" : typeof a === "number" ? a.toLocaleString("en-NZ") + " ft" : "—";
  const fmtShortAlt = (a) => a === "ground" ? "GND" : typeof a === "number" ? a.toLocaleString("en-NZ") + " ft" : "—";
  const fmt = (v, unit = "", d = 0) => (typeof v === "number" ? v.toFixed(d) + unit : "—");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const callsign = (ac) => ac.flight || ac.r || ac.hex.toUpperCase();
  const EMERG = { "7500": "HIJACK", "7600": "RADIO FAIL", "7700": "EMERGENCY" };
  const emergencyOf = (ac) =>
    EMERG[ac.squawk] || (ac.emergency && ac.emergency !== "none" ? ac.emergency.toUpperCase() : null);

  // ---------- Data ----------
  function ingest(list, nowS) {
    for (const raw of list) {
      if (typeof raw.lat !== "number" || typeof raw.lon !== "number") continue;
      const seenPos = typeof raw.seen_pos === "number" ? raw.seen_pos : (raw.seen || 0);
      const posTime = nowS - seenPos;
      const prev = aircraft.get(raw.hex);
      if (prev && prev.posTime >= posTime) continue; // already have newer from another region

      const ac = prev || { hex: raw.hex, trail: [], marker: null, iconKey: "" };
      ac.flight = (raw.flight || "").replace(/@/g, "").trim(); // "@" pads unset callsigns
      ac.r = raw.r || "";
      ac.t = raw.t || "";
      ac.desc = raw.desc || "";
      ac.op = raw.ownOp || "";
      ac.alt = raw.alt_baro ?? raw.alt_geom;
      ac.altGeom = raw.alt_geom;
      ac.gs = raw.gs;
      ac.track = raw.track ?? raw.true_heading ?? raw.mag_heading ?? ac.track;
      ac.vr = raw.baro_rate ?? raw.geom_rate;
      ac.squawk = raw.squawk || "";
      ac.emergency = raw.emergency;
      ac.category = raw.category || "";
      ac.nonAircraft = isNonAircraft(ac);
      ac.glyph = ac.nonAircraft ? "ground" : glyphFor(ac.category);
      ac.lat = raw.lat; ac.lon = raw.lon;
      ac.posTime = posTime;
      ac.lastSeen = nowS - (raw.seen || 0);
      ac.src = raw.type || "";
      ac.mach = raw.mach; ac.ias = raw.ias; ac.tas = raw.tas;
      ac.ws = raw.ws; ac.wd = raw.wd; ac.oat = raw.oat;
      ac.navAlt = raw.nav_altitude_mcp ?? raw.nav_altitude_fms;

      const last = ac.trail[ac.trail.length - 1];
      if (!last || last[0] !== raw.lat || last[1] !== raw.lon) {
        ac.trail.push([raw.lat, raw.lon, typeof ac.alt === "number" ? ac.alt : 0]);
        if (ac.trail.length > TRAIL_MAX) ac.trail.shift();
      }
      aircraft.set(ac.hex, ac);
    }
  }

  // Server clock offset so dead-reckoning uses the feed's notion of "now"
  let clockOffset = 0;
  const nowS = () => Date.now() / 1000 + clockOffset;

  let cycleSeconds = 0; // how long the server takes to refresh everything in view
  async function pollLoop() {
    let wait = POLL_MS;
    try {
      // Ask for the visible area (plus a margin); the server polls only those circles
      const b = map.getBounds().pad(0.1);
      const box = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((v) => v.toFixed(2)).join(",");
      const res = await fetch(`${FEED_URL}?box=${box}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`Feed server returned HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) {
        // Server is up but hasn't had a good response from adsb.fi yet
        if (data.error) throw new Error(`adsb.fi: ${data.error}`);
      } else {
        const now = data.now;
        clockOffset = now - Date.now() / 1000;
        ingest(data.aircraft || [], now);
        cycleSeconds = data.cycleSeconds || 0;
        if (!document.querySelector("#list .row")) renderList(); // don't wait for the 3 s refresh
        lastOk = data.lastOkAt || Date.now();
        failStreak = 0;
        setStatus(true);
      }
    } catch (e) {
      failStreak++;
      if (failStreak >= 2) setStatus(false, e);
      wait = Math.min(30000, POLL_MS * 2 ** Math.min(failStreak, 4));
    }
    setTimeout(pollLoop, wait);
  }

  function setStatus(ok, err) {
    const dot = document.getElementById("statusDot");
    const txt = document.getElementById("statusText");
    const banner = document.getElementById("banner");
    dot.className = "dot " + (ok ? "ok" : "err");
    txt.textContent = ok ? "Live" : "Offline";
    const cyc = document.getElementById("cycleText");
    cyc.textContent = ok && cycleSeconds >= 8 ? ` · ~${cycleSeconds} s updates` : "";
    cyc.title = cyc.textContent ? "Wide views cover more of adsb.fi's 250 nm circles, which are fetched one per second" : "";
    if (ok) { banner.classList.remove("show"); return; }
    const msg = err && err.name === "TypeError"
      ? "Can't reach the feed server. Is server.js running? Retrying…"
      : `${err ? err.message : "Feed unavailable"}. Retrying…`;
    banner.textContent = msg;
    banner.classList.add("show");
  }

  // ---------- Rendering ----------
  function projected(ac, t) {
    // Dead-reckon from the last position report, capped so stale targets don't drift far
    const dt = Math.min(Math.max(t - ac.posTime, 0), Math.max(20, cycleSeconds + 10));
    if (ac.alt === "ground" || typeof ac.gs !== "number" || typeof ac.track !== "number" || dt <= 0) {
      return [ac.lat, ac.lon];
    }
    const distNm = ac.gs * dt / 3600;
    const brg = ac.track * Math.PI / 180;
    const dLat = distNm / 60 * Math.cos(brg);
    const dLon = distNm / 60 * Math.sin(brg) / Math.cos(ac.lat * Math.PI / 180);
    return [ac.lat + dLat, ac.lon + dLon];
  }

  function inRegion(ac) {
    return REGION_BOUNDS.pad(0.05).contains([ac.lat, ac.lon]);
  }

  let trailLine = null;
  function drawTrail() {
    trailLayer.clearLayers();
    trailLine = null;
    const ac = selected && aircraft.get(selected);
    if (!ac || ac.trail.length < 2) return;
    // Colour each segment by altitude
    for (let i = 1; i < ac.trail.length; i++) {
      const a = ac.trail[i - 1], b = ac.trail[i];
      L.polyline([[a[0], a[1]], [b[0], b[1]]], {
        color: colorFor({ alt: b[2] }), weight: 3, opacity: 0.9, interactive: false,
      }).addTo(trailLayer);
    }
  }

  function render() {
    const t = nowS();
    for (const [hex, ac] of aircraft) {
      if (t - ac.lastSeen > STALE_S || !inRegion(ac)) {
        if (ac.marker) planeLayer.removeLayer(ac.marker);
        aircraft.delete(hex);
        if (hoverHex === hex) hideHoverCard(true);
        if (selected === hex) select(null);
        continue;
      }
      if (!isShown(ac)) {
        if (ac.marker) { planeLayer.removeLayer(ac.marker); ac.marker = null; ac.iconKey = ""; }
        if (hoverHex === hex) hideHoverCard(true);
        if (selected === hex) select(null);
        continue;
      }
      const pos = projected(ac, t);
      const sel = hex === selected;
      const key = iconKey(ac, sel);
      if (!ac.marker) {
        ac.marker = L.marker(pos, { icon: makeIcon(ac, sel), zIndexOffset: sel ? 1000 : 0, keyboard: false })
          .on("click", () => select(hex))
          .on("mouseover", () => showHoverCard(hex))
          .on("mouseout", () => hideHoverCard())
          .addTo(planeLayer);
        ac.iconKey = key;
      } else {
        ac.marker.setLatLng(pos);
        if (ac.iconKey !== key) {
          ac.marker.setIcon(makeIcon(ac, sel));
          ac.marker.setZIndexOffset(sel ? 1000 : 0);
          ac.iconKey = key;
        }
      }
      const label = callsign(ac);
      const tip = ac.marker.getTooltip();
      if (showLabels || sel) {
        if (!tip) ac.marker.bindTooltip(label, { permanent: true, direction: "right", offset: [12, 0], className: "ac-label" });
        else if (tip.getContent() !== label) tip.setContent(label);
      } else if (tip) {
        ac.marker.unbindTooltip();
      }
    }
    if (hoverHex) updateHoverCard(); // live altitude/speed while pointing at it
    const view = map.getBounds();
    let inView = 0;
    let hiddenInView = 0;
    for (const ac of aircraft.values()) {
      if (!view.contains([ac.lat, ac.lon])) continue;
      if (isShown(ac)) inView++; else hiddenInView++;
    }
    const gm = document.getElementById("groundMeta");
    if (gm) gm.textContent = showGroundObjects ? "Shown as small squares" : hiddenInView ? `${hiddenInView} hidden in view` : "None in view";
    document.getElementById("count").textContent = inView;
    document.getElementById("updated").textContent = lastOk
      ? new Date(lastOk).toLocaleTimeString("en-NZ", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
      : "—";
  }

  // ---------- Hover card (desktop browsers only) ----------
  // Pointing at an aircraft shows a large, easy-to-read card: flight number, airline,
  // route, altitude and speed. Touch screens keep the tap-for-details panel instead.
  const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const hoverCard = document.getElementById("hoverCard");
  let hoverHex = null;
  let hoverHideTimer = null;

  // ICAO airline code -> [IATA code, name], for airlines common in the region.
  // Callsigns use the ICAO code (ANZ558); people know the flight as NZ 558.
  const AIRLINES = {
    ANZ: ["NZ", "Air New Zealand"], QFA: ["QF", "Qantas"], QLK: ["QF", "QantasLink"],
    JST: ["JQ", "Jetstar"], VOZ: ["VA", "Virgin Australia"], RXA: ["ZL", "Rex"],
    UTY: ["QQ", "Alliance Airlines"], CVA: ["3C", "Air Chathams"], SDA: ["S8", "Sounds Air"],
    FJI: ["FJ", "Fiji Airways"], ACI: ["SB", "Aircalin"], AVN: ["NF", "Air Vanuatu"],
    SOL: ["IE", "Solomon Airlines"], ANG: ["PX", "Air Niugini"], HAL: ["HA", "Hawaiian Airlines"],
    UAL: ["UA", "United"], AAL: ["AA", "American Airlines"], DAL: ["DL", "Delta"],
    ACA: ["AC", "Air Canada"], SIA: ["SQ", "Singapore Airlines"], CPA: ["CX", "Cathay Pacific"],
    UAE: ["EK", "Emirates"], QTR: ["QR", "Qatar Airways"], CES: ["MU", "China Eastern"],
    CSN: ["CZ", "China Southern"], CCA: ["CA", "Air China"], KAL: ["KE", "Korean Air"],
    JAL: ["JL", "Japan Airlines"], ANA: ["NH", "ANA"], THA: ["TG", "Thai Airways"],
    MAS: ["MH", "Malaysia Airlines"], XAX: ["D7", "AirAsia X"], LAN: ["LA", "LATAM"],
    GIA: ["GA", "Garuda Indonesia"], PAL: ["PR", "Philippine Airlines"], EVA: ["BR", "EVA Air"],
    CAL: ["CI", "China Airlines"], VJT: ["VJ", "VietJet"], HVN: ["VN", "Vietnam Airlines"],
    TGW: ["TR", "Scoot"], AIC: ["AI", "Air India"], ETD: ["EY", "Etihad"],
  };
  function flightIdentity(ac) {
    const cs = ac.flight || "";
    const m = /^([A-Z]{3})(\d{1,4})([A-Z]?)$/.exec(cs);
    const al = m && AIRLINES[m[1]];
    if (al && !m[3]) return { big: `${al[0]} ${m[2].replace(/^0+(?=\d)/, "")}`, airline: al[1], callsign: cs };
    if (al) return { big: cs, airline: al[1], callsign: null };
    return { big: callsign(ac), airline: null, callsign: null };
  }
  // A private/GA flight usually uses its registration as callsign: no route to look up
  const isRegistrationCallsign = (ac) => !ac.flight || (ac.r && ac.flight === ac.r.replace("-", ""));

  // Routes, cached per callsign for this page
  const routes = new Map(); // callsign -> { state: "loading"|"done"|"error", airports }
  function requestRoute(cs, ac) {
    if (routes.has(cs)) return;
    routes.set(cs, { state: "loading", airports: [] });
    const pos = ac ? `&lat=${ac.lat.toFixed(4)}&lon=${ac.lon.toFixed(4)}` : "";
    fetch(`api/route?callsign=${encodeURIComponent(cs)}${pos}`)
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
      .then((d) => {
        routes.set(cs, { state: "done", airports: d.airports || [] });
        // adsb.im answers in 30-second batches: if it's still looking, ask again after
        if (d.pending) setTimeout(() => {
          routes.delete(cs);
          const h = hoverHex && aircraft.get(hoverHex);
          if (h && h.flight === cs) requestRoute(cs, h);
        }, 32000);
      })
      .catch(() => { routes.set(cs, { state: "error", airports: [] }); setTimeout(() => routes.delete(cs), 60000); })
      .finally(() => { if (hoverHex && aircraft.get(hoverHex) && aircraft.get(hoverHex).flight === cs) updateHoverCard(); });
  }
  const gcNm = (a, b) => map.distance([a.lat, a.lon], [b.lat, b.lon]) / 1852;
  // Route databases can be stale (flight numbers get reused), so only show a leg the
  // aircraft could plausibly be flying: it must be roughly between the two airports
  function plausibleLeg(ac, airports) {
    let best = null;
    for (let i = 0; i + 1 < airports.length; i++) {
      const o = airports[i], d = airports[i + 1];
      if (o.lat == null || d.lat == null) continue;
      const total = gcNm(o, d);
      const detour = gcNm(ac, o) + gcNm(ac, d) - total;
      if (detour <= total * 0.25 + 120 && (!best || detour < best.detour)) best = { o, d, detour };
    }
    return best;
  }

  function hoverCardHtml(ac) {
    const id = flightIdentity(ac);
    // The database shouts ("AIRBUS A-320"); soften all-caps words of 4+ letters, keep codes like ATR
    const niceType = (ac.desc || ac.t || "").replace(/\b[A-Z]{4,}\b/g, (w) => w[0] + w.slice(1).toLowerCase());
    const typeLine = ac.nonAircraft ? nonAircraftKind(ac) : [niceType, ac.r].filter(Boolean).join(" · ");
    let routeHtml;
    if (ac.nonAircraft) {
      routeHtml = "";
    } else if (isRegistrationCallsign(ac)) {
      routeHtml = `<div class="hc-route-none">No published route</div>`;
    } else {
      const r = routes.get(ac.flight);
      const leg = r && r.state === "done" ? plausibleLeg(ac, r.airports) : null;
      if (!r || r.state === "loading") routeHtml = `<div class="hc-route-none">Looking up route…</div>`;
      else if (!leg) routeHtml = `<div class="hc-route-none">Route not available</div>`;
      else {
        const code = (a) => esc(a.iata || a.icao);
        routeHtml = `<div class="hc-route">
          <div><b>${code(leg.o)}</b><span>${esc(leg.o.short)}</span></div>
          <div class="hc-arrow" aria-hidden="true">→</div>
          <div><b>${code(leg.d)}</b><span>${esc(leg.d.short)}</span></div>
        </div>`;
      }
    }
    const altTxt = ac.alt === "ground" ? "Ground" : typeof ac.alt === "number" ? `${ac.alt.toLocaleString("en-NZ")} ft` : "—";
    const trend = typeof ac.vr === "number" && ac.alt !== "ground" ? (ac.vr > 300 ? ' <i class="hc-trend" title="Climbing">▲</i>' : ac.vr < -300 ? ' <i class="hc-trend" title="Descending">▼</i>' : "") : "";
    const spdTxt = typeof ac.gs === "number" ? `${Math.round(ac.gs)} kt <small>${Math.round(ac.gs * 1.852)} km/h</small>` : "—";
    return `<div class="hc-top">
        <div class="hc-flight">${esc(id.big)}</div>
        ${id.airline ? `<div class="hc-airline">${esc(id.airline)}${id.callsign ? ` · ${esc(id.callsign)}` : ""}</div>` : ""}
        ${typeLine ? `<div class="hc-type">${esc(typeLine)}</div>` : ""}
      </div>
      ${routeHtml}
      ${ac.nonAircraft ? "" : `<div class="hc-stats">
        <div><span>Altitude</span><b>${altTxt}${trend}</b></div>
        <div><span>Speed</span><b>${spdTxt}</b></div>
      </div>`}`;
  }

  function positionHoverCard() {
    const ac = hoverHex && aircraft.get(hoverHex);
    if (!ac || hoverCard.hidden) return;
    const p = map.latLngToContainerPoint(projected(ac, nowS()));
    const w = hoverCard.offsetWidth, h = hoverCard.offsetHeight;
    const size = map.getSize();
    let x = Math.min(Math.max(p.x - w / 2, 8), size.x - w - 8);
    let y = p.y - h - 22; // above the aircraft…
    if (y < 8) y = p.y + 22; // …or below it near the top edge
    hoverCard.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }
  function updateHoverCard() {
    const ac = hoverHex && aircraft.get(hoverHex);
    if (!ac) { hideHoverCard(true); return; }
    hoverCard.innerHTML = hoverCardHtml(ac);
    hoverCard.hidden = false;
    positionHoverCard();
  }
  function showHoverCard(hex) {
    if (!canHover) return;
    clearTimeout(hoverHideTimer);
    hoverHex = hex;
    const ac = aircraft.get(hex);
    if (ac && !ac.nonAircraft && !isRegistrationCallsign(ac)) requestRoute(ac.flight, ac);
    updateHoverCard();
  }
  function hideHoverCard(now) {
    clearTimeout(hoverHideTimer);
    const hide = () => { hoverHex = null; hoverCard.hidden = true; };
    if (now) hide(); else hoverHideTimer = setTimeout(hide, 120);
  }
  map.on("move", positionHoverCard);
  map.on("zoomstart", () => hideHoverCard(true));
  // Route data is shown on this device, so credit its sources (adsb.im's is ODbL)
  if (canHover) map.attributionControl.addAttribution('Routes <a href="https://adsb.im/">adsb.im</a> (ODbL), <a href="https://hexdb.io/">hexdb.io</a>');

  // ---------- List ----------
  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  const sortEl = document.getElementById("sort");
  try { sortEl.value = localStorage.getItem("nzskies-sort") || "cs"; } catch {}

  function renderList() {
    const q = searchEl.value.trim().toLowerCase();
    // The list follows the map: aircraft in view (plus the selected one)
    const view = map.getBounds();
    let rows = [...aircraft.values()].filter((ac) => isShown(ac) && (ac.hex === selected || view.contains([ac.lat, ac.lon])));
    if (q) {
      rows = rows.filter((ac) =>
        [ac.flight, ac.r, ac.t, ac.desc, ac.hex, ac.squawk, ac.op].some((v) => v && v.toLowerCase().includes(q)));
    }
    const altNum = (a) => a === "ground" ? 0 : typeof a === "number" ? a : -1;
    const by = sortEl.value;
    rows.sort((a, b) => {
      const ea = emergencyOf(a) ? 0 : 1, eb = emergencyOf(b) ? 0 : 1;
      if (ea !== eb) return ea - eb;
      if (by === "alt") return altNum(b.alt) - altNum(a.alt);
      if (by === "gs") return (b.gs ?? -1) - (a.gs ?? -1);
      if (by === "type") return (a.t || "zzzz").localeCompare(b.t || "zzzz") || callsign(a).localeCompare(callsign(b));
      return callsign(a).localeCompare(callsign(b));
    });
    if (!rows.length) {
      listEl.innerHTML = `<div class="empty">${q && aircraft.size ? "No aircraft in view match that search." : lastOk ? "No aircraft in view right now." : "Waiting for the first update from adsb.fi…"}</div>`;
      return;
    }
    const scroll = listEl.scrollTop;
    listEl.innerHTML = rows.map((ac) => {
      const em = emergencyOf(ac);
      const sub = [ac.r && ac.r !== callsign(ac) ? ac.r : "", ac.t].filter(Boolean).join(" · ") || ac.hex.toUpperCase();
      return `<div class="row${ac.hex === selected ? " sel" : ""}${em ? " emerg" : ""}" data-hex="${esc(ac.hex)}">
        <div class="swatch" style="background:${colorFor(ac)}"></div>
        <div><div class="cs">${esc(callsign(ac))}${em ? `<span class="badge">${esc(em)}</span>` : ""}</div>
          <div class="sub">${esc(sub)}</div></div>
        <div class="num"><b>${esc(fmtShortAlt(ac.alt))}</b><br>${esc(fmt(ac.gs, " kt"))}</div>
      </div>`;
    }).join("");
    listEl.scrollTop = scroll;
  }
  listEl.addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    select(row.dataset.hex, true);
  });
  searchEl.addEventListener("input", renderList);
  sortEl.addEventListener("change", () => {
    try { localStorage.setItem("nzskies-sort", sortEl.value); } catch {}
    renderList();
  });

  // ---------- Detail ----------
  const detailEl = document.getElementById("detail");
  function renderDetail() {
    const ac = selected && aircraft.get(selected);
    if (!ac) { detailEl.classList.remove("open"); detailEl.innerHTML = ""; return; }
    const em = emergencyOf(ac);
    const age = Math.max(0, nowS() - ac.lastSeen);
    const vr = typeof ac.vr === "number" ? (ac.vr > 0 ? "▲ " : ac.vr < 0 ? "▼ " : "") + Math.abs(ac.vr).toLocaleString("en-NZ") + " fpm" : "—";
    const cells = [
      ["Altitude", fmtAlt(ac.alt)],
      ["Speed", fmt(ac.gs, " kt")],
      ["Track", fmt(ac.track, "°")],
      ["Vert rate", vr],
      ["Squawk", ac.squawk || "—"],
      ["Rego", ac.r || "—"],
      ["Type", ac.t || "—"],
      ["Hex", ac.hex.toUpperCase()],
      ["Source", ac.src.startsWith("adsb") ? "ADS-B" : ac.src.startsWith("mlat") ? "MLAT" : ac.src.startsWith("tisb") ? "TIS-B" : ac.src || "—"],
      ["Sel alt", typeof ac.navAlt === "number" ? ac.navAlt.toLocaleString("en-NZ") + " ft" : "—"],
      ["Mach", fmt(ac.mach, "", 3)],
      ["Wind", typeof ac.ws === "number" ? `${fmt(ac.wd, "°")} / ${fmt(ac.ws, " kt")}` : "—"],
      ["Position", `${ac.lat.toFixed(3)}, ${ac.lon.toFixed(3)}`],
      ["Last seen", age < 2 ? "now" : age.toFixed(0) + " s ago"],
      ["Category", ac.category || "—"],
    ];
    detailEl.innerHTML = `
      <div class="d-top">
        <div>
          <h2>${esc(callsign(ac))}${em ? `<span class="badge">${esc(em)}</span>` : ""}</h2>
          <div class="desc">${esc(ac.desc || ac.t || "Unknown type")}${ac.op ? " · " + esc(ac.op) : ""}</div>
        </div>
        <button class="icon-btn" id="closeDetail" title="Close" aria-label="Close details">✕</button>
      </div>
      <div class="grid">${cells.map(([k, v]) => `<div class="cell"><div class="k">${k}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`).join("")}</div>
      <div class="d-links">
        <a href="https://globe.adsb.fi/?icao=${encodeURIComponent(ac.hex)}" target="_blank" rel="noopener">Open on globe.adsb.fi ↗</a>
        ${ac.flight ? `<a href="https://www.flightradar24.com/${encodeURIComponent(ac.flight)}" target="_blank" rel="noopener">Flight info ↗</a>` : ""}
      </div>`;
    detailEl.classList.add("open");
    document.getElementById("closeDetail").onclick = () => select(null);
  }

  function select(hex, pan = false) {
    selected = hex;
    drawTrail();
    renderDetail();
    renderList();
    render();
    const ac = hex && aircraft.get(hex);
    if (ac && pan) map.panTo(projected(ac, nowS()));
    if (hex) document.getElementById("aside").classList.remove("collapsed");
    updateSheetToggle();
  }
  map.on("click", () => select(null));

  // ---------- Controls ----------
  const labelsBtn = document.getElementById("labelsBtn");
  const syncLabelsBtn = () => {
    labelsBtn.setAttribute("aria-pressed", String(showLabels));
    labelsBtn.style.borderColor = showLabels ? "var(--accent)" : "";
    labelsBtn.style.color = showLabels ? "var(--accent)" : "";
  };
  syncLabelsBtn();
  labelsBtn.onclick = () => {
    showLabels = !showLabels;
    try { localStorage.setItem("nzskies-labels", showLabels ? "1" : "0"); } catch {}
    syncLabelsBtn();
    render();
  };

  function applyTheme() {
    tiles.setUrl(basemapUrl()); // MapTiler has separate light and dark styles
    for (const ac of aircraft.values()) ac.iconKey = ""; // force icon recolour
    paintLegend();
    redrawWind();
    drawTrail();
    render();
    renderList();
  }
  document.getElementById("themeBtn").onclick = () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("nzskies-theme", root.dataset.theme); } catch {}
    applyTheme();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!root.dataset.theme) applyTheme(); });

  const asideEl = document.getElementById("aside");
  const sheetToggle = document.getElementById("sheetToggle");
  function updateSheetToggle() {
    sheetToggle.textContent = asideEl.classList.contains("collapsed") ? "Show list ▴" : "Hide list ▾";
  }
  sheetToggle.onclick = () => {
    asideEl.classList.toggle("collapsed");
    updateSheetToggle();
    setTimeout(() => map.invalidateSize(), 50);
  };

  // ---------- Wind layer ----------
  // Forecast winds from Open-Meteo (free, no key). Fetched by the browser, not
  // server.js: Open-Meteo's free limit is per IP, and hosting providers share IPs.
  const WIND_LEVELS = {
    "10m":    { label: "Surface",    detail: "10 m above ground", speedScale: 0.06 },
    "850hPa": { label: "~5,000 ft",  detail: "850 hPa",           speedScale: 0.05 },
    "500hPa": { label: "~18,000 ft", detail: "500 hPa",           speedScale: 0.035 },
    "250hPa": { label: "~34,000 ft", detail: "250 hPa",           speedScale: 0.025 },
  };
  // The grid follows the map view: at most WIND_MAX_POINTS points over the visible
  // area plus a margin, finer when zoomed in. Each point counts as one call against
  // the viewer's own free Open-Meteo allowance (10,000/day per IP), so grids are
  // cached for 3 hours and only refetched when the view leaves the loaded grid.
  // Open-Meteo also limits each IP to 600 calls a minute, hence the small grid
  // (~250-300 points once snapped) and a gap between fetches: at most two a minute.
  const WIND_MAX_POINTS = 250;
  const WIND_MIN_GAP_MS = 35 * 1000;
  let windLastFetchAt = 0;
  const WIND_CACHE_KEY = "nzskies-wind-v3";
  let WIND_STEP = 1.5, WIND_LATS = [], WIND_LONS = []; // grid of the loaded data
  let windRetryAt = 0; // after an error, don't refetch on every pan
  let windMoveTimer = null;

  function clampedView(pad) {
    const b = map.getBounds().pad(pad);
    return {
      s: Math.max(b.getSouth(), -60), n: Math.min(b.getNorth(), 5),
      w: Math.max(b.getWest(), 95), e: Math.min(b.getEast(), 200),
    };
  }
  function idealWindGrid() {
    const v = clampedView(0.15);
    const step = Math.max(0.5, Math.ceil(Math.sqrt(((v.n - v.s) * (v.e - v.w)) / WIND_MAX_POINTS) * 2) / 2);
    const lat0 = Math.ceil(v.n / step) * step, lat1 = Math.floor(v.s / step) * step;
    const lon0 = Math.floor(v.w / step) * step, lon1 = Math.ceil(v.e / step) * step;
    const lats = [], lons = [];
    for (let la = lat0; la >= lat1 - 1e-9; la -= step) lats.push(+la.toFixed(2));
    for (let lo = lon0; lo <= lon1 + 1e-9; lo += step) lons.push(+lo.toFixed(2));
    return { step, lats, lons };
  }
  // A loaded grid is good for the view if it covers it and isn't much coarser than ideal
  function windGridFits(data) {
    if (!data || !data.grid || Date.now() - data.fetchedAt > WIND_MAX_AGE_MS) return false;
    const g = data.grid, v = clampedView(0);
    const covers = v.n <= g.lats[0] + 1e-6 && v.s >= g.lats[g.lats.length - 1] - 1e-6 &&
      v.w >= g.lons[0] - 1e-6 && v.e <= g.lons[g.lons.length - 1] + 1e-6;
    return covers && g.step <= idealWindGrid().step * 2;
  }
  function useWindData(data) {
    windData = data;
    WIND_STEP = data.grid.step; WIND_LATS = data.grid.lats; WIND_LONS = data.grid.lons;
  }
  function readWindCache() {
    try { const c = JSON.parse(localStorage.getItem(WIND_CACHE_KEY) || "[]"); return Array.isArray(c) ? c : []; }
    catch { return []; }
  }
  const WIND_MAX_AGE_MS = 3 * 3600 * 1000;
  const WIND_ATTRIB = 'Weather <a href="https://open-meteo.com/">Open-Meteo.com</a>';

  // Speed colour scale (knots); ticks on the legend sit at these values
  const WIND_STOPS = [
    [0, [61, 111, 182]], [10, [58, 159, 191]], [20, [76, 178, 111]], [30, [212, 193, 59]],
    [45, [227, 130, 58]], [60, [216, 69, 63]], [90, [176, 56, 154]], [130, [108, 42, 143]],
  ];
  function windRGB(kn) {
    if (kn <= 0) return WIND_STOPS[0][1];
    for (let i = 1; i < WIND_STOPS.length; i++) {
      const [k1, c1] = WIND_STOPS[i];
      if (kn <= k1) {
        const [k0, c0] = WIND_STOPS[i - 1];
        const f = (kn - k0) / (k1 - k0);
        return [0, 1, 2].map((j) => c0[j] + (c1[j] - c0[j]) * f);
      }
    }
    return WIND_STOPS[WIND_STOPS.length - 1][1];
  }

  let windLevel = "off";
  try { windLevel = localStorage.getItem("nzskies-wind-level") || "off"; } catch {}
  if (windLevel !== "off" && !WIND_LEVELS[windLevel]) windLevel = "off";
  let windData = null;      // { fetchedAt, times, levels: { key: { s: [[pt]], d: [[pt]] } } }
  let windField = null;     // { u: Float32Array, v: Float32Array, time }
  let windFetching = null;
  let windError = null;

  async function loadWind() {
    if (windGridFits(windData)) return windData;
    const hit = readWindCache().find(windGridFits);
    if (hit) { useWindData(hit); return hit; }
    if (windFetching) return windFetching;
    if (Date.now() < windRetryAt && windData) return windData;
    const wait = windLastFetchAt + WIND_MIN_GAP_MS - Date.now();
    if (wait > 0 && windData) {
      // Too soon after the last fetch: keep the current grid and try again when allowed
      clearTimeout(windMoveTimer);
      windMoveTimer = setTimeout(() => { if (windLevel !== "off" && !windGridFits(windData)) refreshWind(); }, wait + 200);
      return windData;
    }
    windLastFetchAt = Date.now();
    const grid = idealWindGrid();
    windFetching = (async () => {
      const qLat = [], qLon = [];
      for (const la of grid.lats) for (const lo of grid.lons) {
        qLat.push(la);
        qLon.push(lo > 180 ? +(lo - 360).toFixed(2) : lo < -180 ? +(lo + 360).toFixed(2) : lo);
      }
      const keys = Object.keys(WIND_LEVELS);
      const hourly = keys.flatMap((k) => [`wind_speed_${k}`, `wind_direction_${k}`]).join(",");
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${qLat.join(",")}&longitude=${qLon.join(",")}` +
        `&hourly=${hourly}&wind_speed_unit=kn&timeformat=unixtime&past_hours=2&forecast_hours=12`;
      const res = await fetch(url);
      const body = await res.json().catch(() => null);
      if (!res.ok || !body || body.error) {
        throw new Error(body && body.reason ? body.reason : `Open-Meteo returned HTTP ${res.status}`);
      }
      const pts = Array.isArray(body) ? body : [body];
      if (pts.length !== qLat.length) throw new Error("Unexpected wind data shape");
      const times = pts[0].hourly.time;
      const levels = {};
      for (const k of keys) {
        // s[t][p], d[t][p]
        levels[k] = {
          s: times.map((_, t) => pts.map((p) => p.hourly[`wind_speed_${k}`][t])),
          d: times.map((_, t) => pts.map((p) => p.hourly[`wind_direction_${k}`][t])),
        };
      }
      const data = { fetchedAt: Date.now(), times, levels, grid: { step: grid.step, lats: grid.lats, lons: grid.lons } };
      // Keep the last few grids so panning back and forth doesn't refetch
      const keep = [data, ...readWindCache().filter((d) => d.grid && Date.now() - d.fetchedAt < WIND_MAX_AGE_MS)].slice(0, 3);
      try { localStorage.setItem(WIND_CACHE_KEY, JSON.stringify(keep)); }
      catch { try { localStorage.setItem(WIND_CACHE_KEY, JSON.stringify([data])); } catch {} }
      useWindData(data);
      return data;
    })();
    try { return await windFetching; }
    catch (e) { windRetryAt = Date.now() + 2 * 60 * 1000; throw e; }
    finally { windFetching = null; }
  }

  function buildWindField() {
    windField = null;
    if (!windData || windLevel === "off") return;
    const lv = windData.levels[windLevel];
    if (!lv) return;
    const now = Date.now() / 1000;
    let ti = 0;
    windData.times.forEach((t, i) => { if (Math.abs(t - now) < Math.abs(windData.times[ti] - now)) ti = i; });
    const n = WIND_LATS.length * WIND_LONS.length;
    const u = new Float32Array(n), v = new Float32Array(n);
    for (let p = 0; p < n; p++) {
      const s = lv.s[ti][p], d = lv.d[ti][p];
      if (s == null || d == null) { u[p] = NaN; v[p] = NaN; continue; }
      // Meteorological direction is where the wind blows FROM
      const r = d * Math.PI / 180;
      u[p] = -s * Math.sin(r);
      v[p] = -s * Math.cos(r);
    }
    windField = { u, v, time: windData.times[ti] };
  }

  // Bilinear interpolation of the wind grid; returns { u, v } in knots or null
  function windAt(lat, lon) {
    if (!windField) return null;
    const fi = (WIND_LATS[0] - lat) / WIND_STEP;
    const fj = (lon - WIND_LONS[0]) / WIND_STEP;
    const nI = WIND_LATS.length, nJ = WIND_LONS.length;
    if (fi < 0 || fj < 0 || fi > nI - 1 || fj > nJ - 1) return null;
    const i0 = Math.min(Math.floor(fi), nI - 2), j0 = Math.min(Math.floor(fj), nJ - 2);
    const di = fi - i0, dj = fj - j0;
    const idx = (i, j) => i * nJ + j;
    const { u, v } = windField;
    const a = idx(i0, j0), b = idx(i0, j0 + 1), c = idx(i0 + 1, j0), d = idx(i0 + 1, j0 + 1);
    const bl = (arr) => arr[a] * (1 - di) * (1 - dj) + arr[b] * (1 - di) * dj + arr[c] * di * (1 - dj) + arr[d] * di * dj;
    const uu = bl(u), vv = bl(v);
    if (Number.isNaN(uu) || Number.isNaN(vv)) return null;
    return { u: uu, v: vv };
  }

  // 0 at the edge of the data grid, 1 from one cell inside it, so the tint has no hard border
  function windEdgeFade(lat, lon) {
    const dLat = Math.min(WIND_LATS[0] - lat, lat - WIND_LATS[WIND_LATS.length - 1]);
    const dLon = Math.min(lon - WIND_LONS[0], WIND_LONS[WIND_LONS.length - 1] - lon);
    return Math.max(0, Math.min(1, Math.min(dLat, dLon) / WIND_STEP));
  }

  // Canvases live in their own pane between the tiles and the aircraft
  const windPane = map.createPane("wind");
  windPane.style.zIndex = 350;
  const tintCanvas = L.DomUtil.create("canvas", "", windPane);
  const flowCanvas = L.DomUtil.create("canvas", "", windPane);
  const tintCtx = tintCanvas.getContext("2d");
  const flowCtx = flowCanvas.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FIELD_CELL = 6; // px between samples of the screen-space wind field
  let screenField = null; // { cols, rows, vx, vy } in px/frame
  let particles = [];
  let windAnim = null;
  let windW = 0, windH = 0;

  function layoutWindCanvases() {
    const size = map.getSize();
    const dpr = window.devicePixelRatio || 1;
    windW = size.x; windH = size.y;
    const topLeft = map.containerPointToLayerPoint([0, 0]);
    L.DomUtil.setPosition(tintCanvas, topLeft);
    L.DomUtil.setPosition(flowCanvas, topLeft);
    flowCanvas.style.width = size.x + "px";
    flowCanvas.style.height = size.y + "px";
    flowCanvas.width = Math.round(size.x * dpr);
    flowCanvas.height = Math.round(size.y * dpr);
    flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawWindTint() {
    const cols = Math.ceil(windW / FIELD_CELL) + 1, rows = Math.ceil(windH / FIELD_CELL) + 1;
    tintCanvas.width = cols; tintCanvas.height = rows; // upscaled smoothly by CSS
    tintCanvas.style.width = cols * FIELD_CELL + "px";
    tintCanvas.style.height = rows * FIELD_CELL + "px";
    const img = tintCtx.createImageData(cols, rows);
    const vx = new Float32Array(cols * rows), vy = new Float32Array(cols * rows);
    const scale = WIND_LEVELS[windLevel].speedScale;
    const alpha = isDark() ? 105 : 72;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ll = map.containerPointToLatLng([c * FIELD_CELL, r * FIELD_CELL]);
        const w = windAt(ll.lat, ll.lng < 0 ? ll.lng + 360 : ll.lng);
        const k = r * cols + c;
        if (!w) { vx[k] = NaN; continue; }
        vx[k] = w.u * scale; vy[k] = -w.v * scale;
        const [R, G, B] = windRGB(Math.hypot(w.u, w.v));
        img.data[k * 4] = R; img.data[k * 4 + 1] = G; img.data[k * 4 + 2] = B;
        img.data[k * 4 + 3] = alpha * windEdgeFade(ll.lat, ll.lng < 0 ? ll.lng + 360 : ll.lng);
      }
    }
    tintCtx.putImageData(img, 0, 0);
    screenField = { cols, rows, vx, vy };
  }

  function fieldAt(x, y) {
    if (!screenField) return null;
    const { cols, rows, vx, vy } = screenField;
    const fx = x / FIELD_CELL, fy = y / FIELD_CELL;
    const c0 = Math.floor(fx), r0 = Math.floor(fy);
    if (c0 < 0 || r0 < 0 || c0 >= cols - 1 || r0 >= rows - 1) return null;
    const dx = fx - c0, dy = fy - r0;
    const a = r0 * cols + c0, b = a + 1, c = a + cols, d = c + 1;
    const ux = vx[a] * (1 - dx) * (1 - dy) + vx[b] * dx * (1 - dy) + vx[c] * (1 - dx) * dy + vx[d] * dx * dy;
    if (Number.isNaN(ux)) return null;
    const uy = vy[a] * (1 - dx) * (1 - dy) + vy[b] * dx * (1 - dy) + vy[c] * (1 - dx) * dy + vy[d] * dx * dy;
    return [ux, uy];
  }

  function spawn(p) {
    p.x = Math.random() * windW;
    p.y = Math.random() * windH;
    p.age = 0;
    p.max = 40 + Math.random() * 80;
    return p;
  }

  function resetParticles() {
    const n = Math.min(2600, Math.round(windW * windH / 320));
    particles = Array.from({ length: n }, () => spawn({}));
    flowCtx.clearRect(0, 0, windW, windH);
  }

  function animateWind() {
    windAnim = requestAnimationFrame(animateWind);
    const ctx = flowCtx;
    // Fade the previous frame to leave short trails
    ctx.globalCompositeOperation = "destination-in";
    ctx.fillStyle = "rgba(0,0,0,0.9)";
    ctx.fillRect(0, 0, windW, windH);
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = isDark() ? "rgba(235,242,248,0.8)" : "rgba(24,33,43,0.6)";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (const p of particles) {
      const f = p.age++ < p.max ? fieldAt(p.x, p.y) : null;
      if (!f) { spawn(p); continue; }
      const nx = p.x + f[0], ny = p.y + f[1];
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(nx, ny);
      p.x = nx; p.y = ny;
    }
    ctx.stroke();
  }

  function stopWindAnim() {
    if (windAnim) cancelAnimationFrame(windAnim);
    windAnim = null;
  }

  function redrawWind() {
    stopWindAnim();
    if (windLevel === "off" || !windField) {
      windPane.style.display = "none";
      return;
    }
    windPane.style.display = "";
    layoutWindCanvases();
    drawWindTint();
    resetParticles();
    if (!reduceMotion && !document.hidden) animateWind();
  }

  map.on("zoomstart", () => { if (windLevel !== "off") { stopWindAnim(); windPane.style.display = "none"; } });
  map.on("moveend resize", redrawWind);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopWindAnim();
    else if (windLevel !== "off" && windField && !windAnim && !reduceMotion) animateWind();
  });

  // Flight categories used by the airport weather layer
  const FLT_CAT = {
    VFR:  { color: "#2FA866", text: "Visual flight rules" },
    MVFR: { color: "#2F7FD8", text: "Marginal VFR" },
    IFR:  { color: "#D8453F", text: "Instrument flight rules" },
    LIFR: { color: "#B0389A", text: "Low IFR" },
  };

  // Control
  const windCtl = L.control({ position: "topright" });
  windCtl.onAdd = () => {
    const d = L.DomUtil.create("div", "wind-ctl");
    const ticks = WIND_STOPS.map(([k]) => `<span>${k}</span>`).join("");
    d.innerHTML = `
      <button class="lyr-head" id="lyrHead" aria-expanded="true">Layers <span aria-hidden="true">▾</span></button>
      <div class="lyr-body">
      <div class="lyr-sec on" id="gdSec">
        <label class="lyr-row"><input type="checkbox" id="groundToggle"><span>Ground vehicles &amp; beacons</span></label>
        <div class="lyr-more"><div class="wind-meta" id="groundMeta"></div></div>
      </div>
      <div class="lyr-sec" id="apSec">
        <label class="lyr-row"><input type="checkbox" id="apToggle"><span>Airport weather</span></label>
        <div class="lyr-more">
          <div class="fc-chips">${Object.entries(FLT_CAT).map(([k, c]) => `<span title="${c.text}"><i style="background:${c.color}"></i>${k}</span>`).join("")}</div>
          <div class="wind-meta" id="apMeta"></div>
        </div>
      </div>
      <div class="lyr-sec" id="rdSec">
        <label class="lyr-row"><input type="checkbox" id="radarToggle"><span>Rain radar</span></label>
        <div class="lyr-more">
          <div class="radar-bar">
            <button class="icon-btn" id="radarPlay" aria-label="Play radar loop">▶</button>
            <input type="range" id="radarSlider" min="0" max="0" value="0" aria-label="Radar time">
          </div>
          <div class="radar-scale"><span>Light</span><span class="radar-ramp"></span><span>Heavy</span></div>
          <div class="wind-meta" id="radarMeta"></div>
        </div>
      </div>
      <div class="lyr-sec">
      <label class="wind-row"><span>Wind</span>
        <select id="windLevel" aria-label="Wind layer">
          <option value="off">Off</option>
          ${Object.entries(WIND_LEVELS).map(([k, l]) => `<option value="${k}">${l.label}</option>`).join("")}
        </select></label>
      <div class="wind-more">
        <div class="bar" id="windBar"></div>
        <div class="ticks">${ticks}</div>
        <div class="wind-here" id="windHere">${matchMedia("(hover: none)").matches ? "Tap" : "Point at"} the map for wind there</div>
        <div class="wind-meta" id="windMeta"></div>
      </div>
      </div>
      </div>`;
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  windCtl.addTo(map);
  const windCtlEl = windCtl.getContainer();
  const windSelect = document.getElementById("windLevel");
  const windMeta = document.getElementById("windMeta");
  const windHere = document.getElementById("windHere");
  document.getElementById("windBar").style.background = `linear-gradient(90deg, ${
    WIND_STOPS.map(([, c], i) => `rgb(${c.join(",")}) ${(i / (WIND_STOPS.length - 1) * 100).toFixed(1)}%`).join(",")})`;
  windSelect.value = windLevel;

  function updateWindMeta() {
    if (windError) {
      windMeta.innerHTML = `<span class="wind-err">${esc(windError)}</span>`;
    } else if (windFetching && !windField) {
      windMeta.textContent = "Loading forecast…";
    } else if (windField) {
      const t = new Date(windField.time * 1000).toLocaleString("en-NZ", {
        timeZone: "Pacific/Auckland", weekday: "short", hour: "numeric", minute: "2-digit",
      });
      const pending = !windGridFits(windData);
      windMeta.textContent = `${WIND_LEVELS[windLevel].detail} · forecast for ${t} NZ time · knots` +
        (pending ? " · loading this area shortly…" : "");
    } else {
      windMeta.textContent = "";
    }
  }

  function showWindAt(latlng) {
    if (windLevel === "off") return;
    const w = windAt(latlng.lat, latlng.lng < 0 ? latlng.lng + 360 : latlng.lng);
    if (!w) { windHere.textContent = "No wind data here"; return; }
    const spd = Math.hypot(w.u, w.v);
    const from = (Math.atan2(-w.u, -w.v) * 180 / Math.PI + 360) % 360;
    windHere.textContent = spd < 1 ? "Calm" : `From ${from.toFixed(0).padStart(3, "0")}° at ${spd.toFixed(0)} kt`;
  }
  map.on("mousemove", (e) => showWindAt(e.latlng));
  map.on("click", (e) => showWindAt(e.latlng));

  async function setWindLevel(level) {
    windLevel = level;
    try { localStorage.setItem("nzskies-wind-level", level); } catch {}
    windCtlEl.classList.toggle("on", level !== "off");
    if (level === "off") {
      map.attributionControl.removeAttribution(WIND_ATTRIB);
      buildWindField();
      redrawWind();
      return;
    }
    map.attributionControl.addAttribution(WIND_ATTRIB);
    await refreshWind();
  }
  async function refreshWind() {
    const level = windLevel;
    const before = windData;
    windError = null;
    const loading = loadWind();
    updateWindMeta();
    try {
      await loading;
    } catch (e) {
      windError = e && e.name === "TypeError" ? "Couldn't reach Open-Meteo" : (e.message || "Wind data unavailable");
    }
    if (windLevel !== level || windLevel === "off") return; // changed while loading
    if (windData !== before || !windField) { buildWindField(); redrawWind(); }
    updateWindMeta();
  }
  // Load a grid for the new view once panning/zooming settles
  map.on("moveend", () => {
    if (windLevel === "off") return;
    clearTimeout(windMoveTimer);
    windMoveTimer = setTimeout(() => { if (!windGridFits(windData)) refreshWind(); else updateWindMeta(); }, 700);
  });
  windSelect.addEventListener("change", () => setWindLevel(windSelect.value));
  setWindLevel(windLevel);

  // Collapsible layers panel (starts collapsed on phones)
  const lyrHead = document.getElementById("lyrHead");
  let lyrCollapsed = matchMedia("(max-width: 760px)").matches;
  try { const c = localStorage.getItem("nzskies-layers-collapsed"); if (c !== null) lyrCollapsed = c === "1"; } catch {}
  const syncLyr = () => {
    windCtlEl.classList.toggle("collapsed", lyrCollapsed);
    lyrHead.setAttribute("aria-expanded", String(!lyrCollapsed));
  };
  syncLyr();
  lyrHead.onclick = () => {
    lyrCollapsed = !lyrCollapsed;
    try { localStorage.setItem("nzskies-layers-collapsed", lyrCollapsed ? "1" : "0"); } catch {}
    syncLyr();
  };

  const nzTime = (unixS) => new Date(unixS * 1000).toLocaleTimeString("en-NZ", {
    timeZone: "Pacific/Auckland", hour: "numeric", minute: "2-digit",
  });
  const agoText = (unixS) => {
    const m = Math.round((Date.now() / 1000 - unixS) / 60);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`;
  };

  // ---------- Rain radar (RainViewer) ----------
  // Free RainViewer tiles: past ~2 h in 10-minute frames, zoom 7 at most
  // (Leaflet enlarges zoom-7 tiles beyond that), one colour scheme.
  const RADAR_ATTRIB = 'Radar <a href="https://www.rainviewer.com/">RainViewer</a>';
  const radarPane = map.createPane("radar");
  radarPane.style.zIndex = 330;
  radarPane.style.pointerEvents = "none";
  const radarSec = document.getElementById("rdSec");
  const radarToggle = document.getElementById("radarToggle");
  const radarSlider = document.getElementById("radarSlider");
  const radarPlayBtn = document.getElementById("radarPlay");
  const radarMeta = document.getElementById("radarMeta");
  let radarOn = false;
  try { radarOn = localStorage.getItem("nzskies-radar") === "1"; } catch {}
  let radarFrames = [];      // [{ time, path }]
  let radarHost = "";
  let radarIdx = -1;
  const radarLayers = new Map(); // path -> L.TileLayer
  let radarTimer = null;
  let radarRefreshTimer = null;
  const RADAR_OPACITY = 0.7;

  function radarLayerFor(frame) {
    let lyr = radarLayers.get(frame.path);
    if (!lyr) {
      lyr = L.tileLayer(`${radarHost}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
        pane: "radar", opacity: 0, maxNativeZoom: 7, maxZoom: 19, tileSize: 256,
        zIndex: frame.time, className: "radar-tiles",
      });
      radarLayers.set(frame.path, lyr);
    }
    if (!map.hasLayer(lyr)) lyr.addTo(map);
    return lyr;
  }

  function showRadarFrame(i) {
    if (!radarFrames.length) return;
    radarIdx = (i + radarFrames.length) % radarFrames.length;
    const frame = radarFrames[radarIdx];
    const cur = radarLayerFor(frame);
    // Preload the next frame while playing so the loop doesn't flicker
    if (radarTimer) radarLayerFor(radarFrames[(radarIdx + 1) % radarFrames.length]);
    for (const [path, lyr] of radarLayers) lyr.setOpacity(path === frame.path ? RADAR_OPACITY : 0);
    cur.setOpacity(RADAR_OPACITY);
    radarSlider.value = String(radarIdx);
    const latest = radarIdx === radarFrames.length - 1;
    radarMeta.textContent = `${nzTime(frame.time)} NZ time · ${agoText(frame.time)}${latest ? " (latest)" : ""}`;
  }

  function stopRadarLoop() {
    clearTimeout(radarTimer);
    radarTimer = null;
    radarPlayBtn.textContent = "▶";
    radarPlayBtn.setAttribute("aria-label", "Play radar loop");
  }
  function radarTick() {
    const atEnd = radarIdx >= radarFrames.length - 1;
    showRadarFrame(atEnd ? 0 : radarIdx + 1);
    // Hold a beat on the latest frame before wrapping round
    radarTimer = setTimeout(radarTick, radarIdx === radarFrames.length - 1 ? 1800 : 600);
  }
  function startRadarLoop() {
    if (radarFrames.length < 2) return;
    radarPlayBtn.textContent = "❚❚";
    radarPlayBtn.setAttribute("aria-label", "Pause radar loop");
    radarTimer = setTimeout(radarTick, 50);
  }
  radarPlayBtn.onclick = () => (radarTimer ? stopRadarLoop() : startRadarLoop());
  radarSlider.addEventListener("input", () => { stopRadarLoop(); showRadarFrame(Number(radarSlider.value)); });

  async function loadRadarFrames() {
    const res = await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`RainViewer returned HTTP ${res.status}`);
    const data = await res.json();
    const frames = (data.radar && data.radar.past) || [];
    if (!frames.length) throw new Error("No radar frames available");
    const wasLatest = radarIdx === -1 || radarIdx === radarFrames.length - 1;
    radarHost = data.host;
    // Drop layers for frames that have aged out
    const keep = new Set(frames.map((f) => f.path));
    for (const [path, lyr] of radarLayers) {
      if (!keep.has(path)) { map.removeLayer(lyr); radarLayers.delete(path); }
    }
    radarFrames = frames;
    radarSlider.max = String(frames.length - 1);
    if (wasLatest && !radarTimer) showRadarFrame(frames.length - 1);
  }

  async function setRadar(on) {
    radarOn = on;
    radarToggle.checked = on;
    radarSec.classList.toggle("on", on);
    try { localStorage.setItem("nzskies-radar", on ? "1" : "0"); } catch {}
    if (!on) {
      stopRadarLoop();
      clearInterval(radarRefreshTimer);
      for (const lyr of radarLayers.values()) map.removeLayer(lyr);
      radarLayers.clear();
      radarFrames = []; radarIdx = -1;
      map.attributionControl.removeAttribution(RADAR_ATTRIB);
      return;
    }
    map.attributionControl.addAttribution(RADAR_ATTRIB);
    radarMeta.textContent = "Loading radar…";
    const refresh = async () => {
      try { await loadRadarFrames(); }
      catch (e) { if (radarOn) radarMeta.innerHTML = `<span class="wind-err">${esc(e.name === "TypeError" ? "Couldn't reach RainViewer" : e.message)}</span>`; }
    };
    await refresh();
    clearInterval(radarRefreshTimer);
    radarRefreshTimer = setInterval(() => { if (radarOn) refresh(); }, 5 * 60 * 1000);
  }
  radarToggle.addEventListener("change", () => setRadar(radarToggle.checked));
  if (radarOn) setRadar(true);

  // ---------- Airport weather (METAR / TAF via server.js) ----------
  const AP_ATTRIB = 'METAR/TAF <a href="https://aviationweather.gov/">NOAA AWC</a>';
  const apPane = map.createPane("airports");
  // Above the aircraft (600): busy airports are covered by traffic otherwise, and
  // an aircraft hidden under a label can still be picked from the list
  apPane.style.zIndex = 610;
  const apLayer = L.layerGroup();
  const apSec = document.getElementById("apSec");
  const apToggle = document.getElementById("apToggle");
  const apMeta = document.getElementById("apMeta");
  let apOn = false;
  try { apOn = localStorage.getItem("nzskies-airports") === "1"; } catch {}
  let apTimer = null;
  let apOpenIcao = null;
  const apMarkers = new Map();

  const kmFromSM = (v) => {
    if (v == null || v === "") return "—";
    if (typeof v === "string" && v.trim().endsWith("+")) return "10 km or more";
    const n = Number(v);
    if (!Number.isFinite(n)) return String(v);
    return n * 1.609 >= 9.95 ? "10 km or more" : `${(n * 1.609).toFixed(n < 3 ? 1 : 0)} km`;
  };
  const windText = (m) => {
    if (m.wspd == null) return "—";
    if (m.wspd === 0) return "Calm";
    const dir = m.wdir === "VRB" || m.wdir == null ? "Variable" : `${String(m.wdir).padStart(3, "0")}°`;
