    return `${dir} ${m.wspd} kt${m.wgst ? `, gusts ${m.wgst}` : ""}`;
  };
  const cloudText = (m) => {
    const c = Array.isArray(m.clouds) ? m.clouds : [];
    if (!c.length) return m.cover === "CAVOK" ? "CAVOK" : m.cover === "CLR" || m.cover === "SKC" ? "Clear" : "No cloud reported";
    return c.map((l) => (l.base != null ? `${l.cover} ${l.base.toLocaleString("en-NZ")} ft` : l.cover)).join(", ");
  };

  function apPopupHtml(ap) {
    const m = ap.metar;
    const fc = m && FLT_CAT[m.fltCat];
    const rows = m ? [
      ["Observed", `${nzTime(m.obsTime)} (${agoText(m.obsTime)})`],
      ["Wind", windText(m)],
      ["Visibility", kmFromSM(m.visib)],
      ["Cloud", cloudText(m)],
      ...(m.wxString ? [["Weather", m.wxString]] : []),
      ["Temp / dew", m.temp != null ? `${m.temp}°C / ${m.dewp ?? "—"}°C` : "—"],
      ["QNH", m.altim != null ? `${Math.round(m.altim)} hPa` : "—"],
    ] : [];
    return `<div class="ap-pop">
      <h3>${esc(ap.icao)}${fc ? `<span class="fc" style="background:${fc.color}" title="${esc(fc.text)}">${esc(m.fltCat)}</span>` : ""}</h3>
      <div class="sub">${esc(ap.name)}</div>
      ${m ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        <div class="lbl">METAR</div><pre>${esc(m.raw)}</pre>` : `<p>No recent report.</p>`}
      ${ap.taf ? `<div class="lbl">TAF · issued ${esc(nzTime(ap.taf.issueTime))}</div><pre>${esc(ap.taf.raw)}</pre>` : ""}
    </div>`;
  }

  function apIcon(ap) {
    const m = ap.metar;
    const color = m && FLT_CAT[m.fltCat] ? FLT_CAT[m.fltCat].color : "#8A9AAA";
    const wind = m && m.wspd != null ? (m.wspd === 0 ? "calm" : `${m.wdir === "VRB" ? "VRB" : String(m.wdir).padStart(3, "0")}/${m.wspd}${m.wgst ? "G" + m.wgst : ""}`) : "";
    return L.divIcon({
      className: "ap-icon",
      html: map.getZoom() < 5
        ? `<span class="ap-pill dot-only" title="${esc(ap.icao)}"><i style="background:${color}"></i></span>`
        : `<span class="ap-pill"><i style="background:${color}"></i>${esc(ap.icao)}${wind ? ` <small>${esc(wind)}</small>` : ""}</span>`,
      iconSize: [0, 0],
    });
  }

  async function loadAirports() {
    try {
      const res = await fetch("api/airports", { cache: "no-store" });
      if (!res.ok) throw new Error(`Feed server returned HTTP ${res.status}`);
      const data = await res.json();
      if (data.error && !data.airports.length) throw new Error(data.error);
      const seen = new Set();
      for (const ap of data.airports) {
        seen.add(ap.icao);
        let mk = apMarkers.get(ap.icao);
        if (!mk) {
          mk = L.marker([ap.lat, ap.lon], { pane: "airports", keyboard: true, title: ap.name })
            .bindPopup("", { maxWidth: 320, autoPanPaddingTopLeft: [10, 60] })
            .on("popupopen", () => { apOpenIcao = ap.icao; })
            .on("popupclose", () => { if (apOpenIcao === ap.icao) apOpenIcao = null; })
            .addTo(apLayer);
          apMarkers.set(ap.icao, mk);
        }
        mk._ap = ap;
        mk.setIcon(apIcon(ap));
        mk.setPopupContent(apPopupHtml(ap));
      }
      for (const [icao, mk] of apMarkers) {
        if (!seen.has(icao)) { apLayer.removeLayer(mk); apMarkers.delete(icao); }
      }
      apMeta.textContent = data.airports.length
        ? `${data.airports.length} airports · updated ${nzTime(data.fetchedAt)}`
        : "No reports available right now";
    } catch (e) {
      apMeta.innerHTML = `<span class="wind-err">${esc(e.name === "TypeError" ? "Can't reach the feed server" : e.message)}</span>`;
    }
  }

  function setAirports(on) {
    apOn = on;
    apToggle.checked = on;
    apSec.classList.toggle("on", on);
    try { localStorage.setItem("nzskies-airports", on ? "1" : "0"); } catch {}
    clearInterval(apTimer);
    if (!on) {
      map.removeLayer(apLayer);
      map.attributionControl.removeAttribution(AP_ATTRIB);
      return;
    }
    apLayer.addTo(map);
    map.attributionControl.addAttribution(AP_ATTRIB);
    apMeta.textContent = "Loading reports…";
    loadAirports();
    apTimer = setInterval(loadAirports, 5 * 60 * 1000);
  }
  let apZoomedOut = map.getZoom() < 5;
  map.on("zoomend", () => {
    const z = map.getZoom() < 5;
    if (z === apZoomedOut) return;
    apZoomedOut = z;
    for (const mk of apMarkers.values()) if (mk._ap) mk.setIcon(apIcon(mk._ap));
  });
  apToggle.addEventListener("change", () => setAirports(apToggle.checked));

  const groundToggle = document.getElementById("groundToggle");
  groundToggle.checked = showGroundObjects;
  groundToggle.addEventListener("change", () => {
    showGroundObjects = groundToggle.checked;
    try { localStorage.setItem("nzskies-ground", showGroundObjects ? "1" : "0"); } catch {}
    render();
    renderList();
  });
  if (apOn) setAirports(true);

  // Keep the forecast hour current, and refresh the data when it gets old
  setInterval(async () => {
    if (windLevel === "off") return;
    const before = windField && windField.time;
    const dataBefore = windData;
    try { await loadWind(); windError = null; } catch {}
    buildWindField();
    if (!windField || windField.time !== before || windData !== dataBefore) redrawWind();
    updateWindMeta();
  }, 10 * 60 * 1000);

  // ---------- Loops ----------
  setInterval(render, 1000);
  setInterval(() => { renderList(); renderDetail(); if (selected) drawTrail(); }, 3000);
  pollLoop();
})();
