# Render Blueprint for NZ Skies Live (nz-adsb/).
# In Render: New → Blueprint → pick this repo and branch → Apply.
services:
  - type: web
    name: nz-skies-live
    runtime: node
    plan: free
    region: singapore # closest Render region to NZ
    rootDir: nz-adsb
    buildCommand: echo "No build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Contact email sent to adsb.im with route lookups (its terms require one).
      # Set the value in the Render dashboard; it's kept out of the repository.
      - key: ROUTE_CONTACT_EMAIL
        sync: false
